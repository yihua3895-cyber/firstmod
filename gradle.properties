org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Minecraft 版本必须与 Forge 版本匹配，才能获取有效构件
minecraft_version=1.20.1
# Minecraft 版本范围可以使用任意正式发布版本作为边界。
# 快照版、预发布版和候选发布版无法保证正确排序，
# 因为它们不遵循标准版本命名约定。
minecraft_version_range=[1.20.1,1.21)
# Forge 版本必须与 Minecraft 版本匹配，才能获取有效构件
forge_version=47.4.28
# Forge 版本范围可以使用任意 Forge 版本作为边界，也可以与加载器版本范围一致
forge_version_range=[47,)
# 加载器版本范围只能使用 Forge/FML 的主版本号作为边界
loader_version_range=[47,)
# 映射所使用的通道。
# 默认支持的映射通道为 ["official", "snapshot", "snapshot_nodoc", "stable", "stable_nodoc"]。
# 可通过 Gradle 插件的 "channelProviders" 扩展注册其他映射通道。
#
# | 通道      | 版本                 | 说明 |
# |-----------|----------------------|--------------------------------------------------------------------------------|
# | official  | MCVersion            | Mojang 映射文件中的官方字段名和方法名 |
# | parchment | YYYY.MM.DD-MCVersion | 在官方映射基础上添加社区提供的参数名和 Javadoc 文档 |
#
# 使用 'official' 或 'parchment' 映射时，必须了解 Mojang 的许可协议。
# 更多信息：https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
#
# Parchment 是由 ParchmentMC 维护的非官方项目，独立于 Minecraft Forge。
# 使用其映射需要额外配置，请参阅 https://parchmentmc.org/docs/getting-started
mapping_channel=parchment
# 要从映射通道查询的映射版本。
# 必须符合映射通道要求的格式。
mapping_version=2023.09.03-1.20.1
# 模组的唯一标识符。英文字母必须小写，且必须符合正则表达式 [a-z][a-z0-9_]{1,63}
# 必须与带有 @Mod 注解的模组主类中的字符串常量一致。
mod_id=firstmod
# 供用户阅读的模组显示名称。
mod_name=firstmod
# 模组的许可协议。可在 https://choosealicense.com/ 查看可选协议。默认为 All Rights Reserved（保留所有权利）。
mod_license=All Rights Reserved
# 模组版本。参阅 https://semver.org/
mod_version=1.0-SNAPSHOT
# 模组的组 ID。仅在将模组作为构件发布到 Maven 仓库时有重要作用。
# 应与模组源代码的基础包名一致。
# 参阅 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.abc.firstmod
# 模组作者。这是用于在模组列表中显示的普通文本字符串。
mod_authors=apple_tea
# 模组描述。这是用于在模组列表中显示的普通多行文本字符串。
mod_description=this is my first mod
